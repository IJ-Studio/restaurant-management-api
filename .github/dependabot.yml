version: 2
updates:
  - package-ecosystem: npm   # también cubre pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: chore(deps)
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      dev-tools:
        dependency-type: development
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: ci(deps)
