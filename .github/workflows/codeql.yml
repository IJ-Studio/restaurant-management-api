# SAST del API (TypeScript). Las alertas High/Critical bloquean el merge con la regla
# "Code scanning results" de la protección de ramas.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
